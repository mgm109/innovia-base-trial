<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハノイの塔</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Prevent page scrolling during touch/drag interaction */
        .no-touch-action {
            touch-action: none;
        }

        /* Custom enlarged range slider */
        input[type=range].large-slider {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range].large-slider:focus {
            outline: none;
        }
        input[type=range].large-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 14px;
            cursor: pointer;
            background: #334155;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        input[type=range].large-slider::-webkit-slider-thumb {
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            transition: background-color 0.15s, transform 0.15s;
        }
        input[type=range].large-slider::-webkit-slider-thumb:hover {
            background: #7dd3fc;
            transform: scale(1.15);
        }

        /* Peg Target Highlight */
        .peg-target-active {
            background-color: rgba(56, 189, 248, 0.15) !important;
            border-color: #38bdf8 !important;
        }

        /* Static Disk Element */
        .disk-element {
            position: absolute;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            cursor: grab;
            z-index: 10;
            box-sizing: border-box;
            transition: none !important; /* Prevents static disks from bouncing on state re-renders */
        }

        .disk-element:active {
            cursor: grabbing;
        }

        /* Floating overlay animated disk */
        .flying-disk {
            position: absolute;
            z-index: 40 !important;
            pointer-events: none !important;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6) !important;
        }

        /* Drag block overlay container */
        #dragContainer {
            position: absolute;
            z-index: 50;
            pointer-events: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Hitbox expansion for smallest disk */
        .disk-hitbox-1::before {
            content: '';
            position: absolute;
            top: -12px;
            bottom: -12px;
            left: -16px;
            right: -16px;
            background: transparent;
        }

        /* Glassmorphism modal background */
        .glass-modal {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
        }
    
        #stage { height:clamp(300px,calc(100dvh - 110px),460px) !important; }
        #stage .rounded-t-lg { height:calc(100% - 100px) !important; }
        [hidden] { display: none !important; }
        .help-actions { display:flex; gap:10px; align-items:center; }
        .help-actions a,.help-actions button,.rules-back { font:inherit; font-size:14px; font-weight:700; color:#cbd5e1; border:1px solid #475569; background:#1e293b; border-radius:10px; padding:6px 16px; text-decoration:none; cursor:pointer; }
        .help-actions a:hover,.help-actions button:hover,.rules-back:hover { color:#f8fafc; border-color:#38bdf8; }
        .help-actions a:focus-visible,.help-actions button:focus-visible,.rules-back:focus-visible,summary:focus-visible { outline:3px solid #38bdf8; outline-offset:3px; }
        .rules-section { width:100%; margin-top:64px; margin-bottom:32px; padding:24px; border:1px solid #475569; border-radius:16px; background:#1e293b; line-height:1.8; user-select:text; scroll-margin-top:16px; }
        .rules-section h2 { font-size:22px; font-weight:800; margin-bottom:12px; }
        .rules-section ol { list-style:none; padding:0; margin:16px 0 24px; }
        .rules-section li+li { margin-top:12px; }
        #puzzle { scroll-margin-top:8px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
        #puzzle::before { content:""; }
        #puzzle h1 { grid-column:2; justify-self:center; }
        #puzzle .help-actions { grid-column:3; justify-self:end; }
        #puzzle h1 { font-size:clamp(22px,3vw,32px); gap:6px; }
        .help-actions { flex-shrink:0; }
        @media(max-width:600px) { #puzzle { grid-template-columns:1fr; } #puzzle::before { display:none; } #puzzle h1 { grid-column:1; font-size:22px; } #puzzle .help-actions { grid-column:1; } .help-actions { gap:6px; } .help-actions a,.help-actions button { padding:6px 10px; } }
        @media(max-width:600px) { #stage > div:first-child > div > div:first-child { padding:6px 8px; font-size:13px; gap:4px; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-2 sm:p-4 overflow-x-hidden">

    <div class="w-full max-w-5xl flex flex-col items-center">
        
        <!-- Header Title Bar -->
        <header id="puzzle" tabindex="-1" class="w-full text-center my-2 flex flex-col items-center gap-2">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide text-sky-400 flex items-center justify-center gap-3">
                <i class="fa-solid fa-cubes-stacked text-amber-400"></i>
                ハノイの塔
            </h1>

            <nav class="help-actions" aria-label="操作の補助">
                <a href="#rules">ルール</a>
            </nav>
        </header>

        <!-- Stage Container -->
        <div id="stage" class="w-full relative mt-2 bg-slate-900 border-2 border-slate-700/80 rounded-2xl no-touch-action shadow-2xl overflow-hidden" style="height: 460px;">
            
            <!-- Target Columns Grid (A: Far Left, B: Middle, C: Far Right) -->
            <div class="absolute inset-0 grid grid-cols-3 h-full w-full pointer-events-none">
                
                <!-- A (FAR LEFT - GOAL) -->
                <div id="pegCol-A" class="relative flex flex-col items-center justify-end pb-8 border-r border-slate-800/60 transition-colors duration-200">
                    <div class="absolute top-4 bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 px-4 py-1.5 rounded-full text-base font-extrabold shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-trophy text-amber-400"></i> A（ゴール）
                    </div>
                    <!-- Rod -->
                    <div class="w-5 bg-gradient-to-t from-slate-600 via-slate-400 to-slate-500 rounded-t-lg shadow-inner" style="height: 330px;"></div>
                </div>

                <!-- B (MIDDLE - AUX) -->
                <div id="pegCol-B" class="relative flex flex-col items-center justify-end pb-8 border-r border-slate-800/60 transition-colors duration-200">
                    <div class="absolute top-4 bg-slate-800/90 border border-slate-600/80 text-slate-300 px-4 py-1.5 rounded-full text-base font-extrabold shadow">
                        B
                    </div>
                    <!-- Rod -->
                    <div class="w-5 bg-gradient-to-t from-slate-600 via-slate-400 to-slate-500 rounded-t-lg shadow-inner" style="height: 330px;"></div>
                </div>

                <!-- C (FAR RIGHT - START) -->
                <div id="pegCol-C" class="relative flex flex-col items-center justify-end pb-8 transition-colors duration-200">
                    <div class="absolute top-4 bg-sky-950/80 border border-sky-500/50 text-sky-300 px-4 py-1.5 rounded-full text-base font-extrabold shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-flag text-sky-400"></i> C（スタート）
                    </div>
                    <!-- Rod -->
                    <div class="w-5 bg-gradient-to-t from-slate-600 via-slate-400 to-slate-500 rounded-t-lg shadow-inner" style="height: 330px;"></div>
                </div>

            </div>

            <!-- Base Platform -->
            <div class="absolute bottom-0 left-0 right-0 h-8 bg-gradient-to-r from-amber-950 via-amber-900 to-amber-950 border-t-2 border-amber-700 shadow-2xl"></div>

            <!-- Vertical Alignment Beam Guide -->
            <div id="targetBeam" class="absolute top-0 bottom-8 w-1 bg-sky-400/50 border-l border-r border-sky-300 hidden pointer-events-none transition-all duration-75"></div>

            <!-- Dynamic Disks Container -->
            <div id="disksContainer" class="absolute inset-0 no-touch-action"></div>

            <!-- Drag Block Overlay Container -->
            <div id="dragContainer" class="hidden"></div>

        </div>

        <!-- Top Controls Display Panel -->
        <div class="w-full mt-3 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-3 sm:p-3 shadow-xl flex flex-col gap-2">
            
            <!-- Row 1: Disk Count Selector, Stat Displays, Action Buttons -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                
                <!-- Disk Count Selector Card -->
                <div class="md:col-span-3 bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex flex-col justify-center items-center">
                    <label for="diskSelect" class="text-slate-300 text-xs sm:text-sm font-bold mb-1.5 flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-sky-400"></i>
                        円盤の枚数
                    </label>
                    <div class="flex items-center gap-2 w-full justify-center">
                        <select id="diskSelect" class="bg-slate-800 border-2 border-sky-500 text-sky-200 text-lg sm:text-xl font-bold rounded-xl px-4 py-1.5 text-center cursor-pointer hover:bg-slate-700 transition">
                            <option value="1">1 枚</option>
                            <option value="2">2 枚</option>
                            <option value="3" selected>3 枚</option>
                            <option value="4">4 枚</option>
                            <option value="5">5 枚</option>
                            <option value="6">6 枚</option>
                            <option value="7">7 枚</option>
                            <option value="8">8 枚</option>
                            <option value="9">9 枚</option>
                            <option value="10">10 枚</option>
                        </select>
                    </div>
                </div>

                <!-- Stats Display: Current Moves & Unlocked/Locked Min Moves -->
                <div class="md:col-span-5 bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 sm:p-4 flex items-center justify-around">
                    <div class="text-center">
                        <span id="movesLabel" class="text-xs sm:text-sm font-bold text-slate-400 block mb-1">現在の手数</span>
                        <span id="currentMovesDisplay" class="text-3xl sm:text-4xl font-extrabold text-amber-400 drop-shadow-md">0</span>
                    </div>
                    <div class="h-10 w-px bg-slate-700"></div>
                    <div class="text-center flex flex-col items-center">
                        <span class="text-xs sm:text-sm font-bold text-slate-400 block mb-1">最短手数</span>
                        <div id="minMovesContainer" class="flex items-center justify-center min-h-[44px]">
                            <!-- Dynamic Content -->
                        </div>
                    </div>
                </div>

                <!-- Action Buttons: Reset & Undo -->
                <div class="md:col-span-4 flex flex-row gap-2 h-full">
                    <button id="resetBtn" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold text-base sm:text-lg rounded-xl py-3 px-3 shadow-lg flex items-center justify-center gap-2 transition active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-rotate-left"></i>
                        リセット
                    </button>
                    <button id="undoBtn" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold text-base sm:text-lg rounded-xl py-3 px-3 shadow-lg flex items-center justify-center gap-2 transition active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-reply"></i>
                        1手戻す
                    </button>
                </div>
            </div>



        </div>

        <section id="rules" tabindex="-1" class="rules-section" aria-labelledby="rules-title">
            <h2 id="rules-title">ルール</h2>
            <p>Cに積まれた穴の開いた円盤を、次のルールに従って、すべてAへ移動させるパズルです。</p>
            <ol>
                <li><strong>ルール1</strong>：円盤は一度に1枚ずつ、A・B・Cのいずれかの杭へ移動できます。</li>
                <li><strong>ルール2</strong>：小さな円盤の上に、それより大きな円盤を置くことはできません。</li>
            </ol>
            <a class="rules-back" href="#puzzle">戻る</a>
        </section>
    </div>

    <!-- Victory Modal -->
    <div id="winModal" class="fixed inset-0 glass-modal flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border-2 border-emerald-500 rounded-3xl p-6 sm:p-8 max-w-lg w-full text-center shadow-2xl transform transition-all scale-100 flex flex-col items-center">
            <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-4xl mb-4 border border-emerald-400 animate-bounce">
                <i class="fa-solid fa-trophy text-amber-400"></i>
            </div>
            <h2 class="text-3xl font-black text-white mb-2">クリアおめでとう！</h2>
            <p class="text-slate-300 text-base mb-4">
                すべての円盤を <strong class="text-emerald-400">A</strong> に移動させました！
            </p>
            
            <div class="bg-slate-900/90 border border-slate-700 rounded-2xl p-4 w-full mb-4 grid grid-cols-2 gap-2">
                <div>
                    <span class="text-xs text-slate-400 block font-bold">今回のかかった手数</span>
                    <span id="winMoves" class="text-2xl font-extrabold text-amber-400">0</span>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-bold">最短手数</span>
                    <span id="winMinMoves" class="text-2xl font-extrabold text-emerald-400">🔒</span>
                </div>
            </div>

            <div id="winUnlockNotice" class="w-full bg-sky-950/90 border border-sky-600/80 rounded-xl p-3 text-left text-xs sm:text-sm mb-6 flex flex-col gap-1">
            </div>

            <button id="winResetBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg rounded-xl py-3 shadow-lg transition active:scale-95 cursor-pointer">
                次へ進む / もう一度挑戦
            </button>
        </div>
    </div>

    <!-- Rule Violation Warning Modal for Free Mode Auto-Goal -->
    <div id="warningModal" class="fixed inset-0 glass-modal flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border-2 border-amber-500 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl flex flex-col items-center">
            <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center text-3xl mb-4 border border-amber-400">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-2xl font-extrabold text-white mb-3">自動ゴールできません</h3>
            <p id="warningMessage" class="text-slate-300 text-sm sm:text-base mb-6 leading-relaxed bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-left">
                ルールを無視した配置（小の上に大）があるため、自動ゴールできません。
            </p>
            <button id="closeWarningBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base sm:text-lg rounded-xl py-3 shadow-lg transition active:scale-95 cursor-pointer">
                理解しました (配置を修正する)
            </button>
        </div>
    </div>

    <script>
        // State management variables
        const primaryMode = 'normal';
        let numDisks = 3;
        
        // FIXED PEG LAYOUT:
        // A: Leftmost (Goal)
        // B: Middle
        // C: Rightmost (Start)
        let pegs = { 'A': [], 'B': [], 'C': [] };
        
        let historyStack = []; // For 1-step undo in normal mode
        let currentMoves = 0;
        let minMoves = 7;
        let activeMode = 'manual';
        let isAnimating = false; // Strict animation lock
        let animatingDiskInfo = null; // { diskVal, fromPeg, fromStackIdx }

        // Pointer Drag State
        let isDragging = false;
        let sourcePeg = null;
        let draggedBlock = []; // Array of disk values being dragged as a block [bottomDisk, ..., topDisk]
        let activePointerId = null;

        // Persistent in-memory stats across session (retained during disk changes, resets, and mode switches)
        let stats = {};
        function initStatsInMemory() {
            for (let i = 1; i <= 10; i++) {
                if (!stats[i]) {
                    stats[i] = { clearCount: 0, minCleared: false };
                }
            }
        }
        initStatsInMemory();

        function isUnlocked(N) {
            const data = stats[N];
            if (!data) return false;
            if (data.minCleared) return true;
            const requiredClears = (N <= 3) ? 3 : 2;
            return data.clearCount >= requiredClears;
        }

        const DISK_COLORS = [
            'linear-gradient(135deg, #f43f5e, #be123c)', // 1: Red
            'linear-gradient(135deg, #fb923c, #c2410c)', // 2: Orange
            'linear-gradient(135deg, #facc15, #a16207)', // 3: Yellow
            'linear-gradient(135deg, #4ade80, #15803d)', // 4: Green
            'linear-gradient(135deg, #2dd4bf, #0f766e)', // 5: Teal
            'linear-gradient(135deg, #38bdf8, #0369a1)', // 6: Sky Blue
            'linear-gradient(135deg, #818cf8, #4338ca)', // 7: Indigo
            'linear-gradient(135deg, #c084fc, #7e22ce)', // 8: Purple
            'linear-gradient(135deg, #f472b6, #be185d)', // 9: Magenta
            'linear-gradient(135deg, #94a3b8, #334155)'  // 10: Slate
        ];

        // DOM element references
        const diskSelect = document.getElementById('diskSelect');
        const movesLabel = document.getElementById('movesLabel');
        const currentMovesDisplay = document.getElementById('currentMovesDisplay');
        const minMovesContainer = document.getElementById('minMovesContainer');
        const resetBtn = document.getElementById('resetBtn');
        const undoBtn = document.getElementById('undoBtn');
        const stage = document.getElementById('stage');
        const disksContainer = document.getElementById('disksContainer');
        const dragContainer = document.getElementById('dragContainer');
        const targetBeam = document.getElementById('targetBeam');
        const winModal = document.getElementById('winModal');
        const winMoves = document.getElementById('winMoves');
        const winMinMoves = document.getElementById('winMinMoves');
        const winUnlockNotice = document.getElementById('winUnlockNotice');
        const winResetBtn = document.getElementById('winResetBtn');
        const warningModal = document.getElementById('warningModal');
        const warningMessage = document.getElementById('warningMessage');
        const closeWarningBtn = document.getElementById('closeWarningBtn');

        /* 1:1 Pure Absolute Pixel Width Calculation */
        function getDiskWidthPx(diskVal) {
            const stageWidth = stage.clientWidth || 800;
            const colWidth = stageWidth / 3;
            const minWidth = 55;
            const maxWidth = colWidth - 28;
            if (numDisks === 1) return (minWidth + maxWidth) / 2;
            return minWidth + (diskVal - 1) * ((maxWidth - minWidth) / (numDisks - 1));
        }

        function getDiskHeight() {
            return Math.min(32, Math.max(14, Math.floor((stage.clientHeight - 110) / numDisks) - 3));
        }

        /* Peg Position Mapping (Left: A, Middle: B, Right: C) */
        function getPegX(pegKey) {
            const stageWidth = stage.clientWidth || 800;
            const colWidth = stageWidth / 3;
            if (pegKey === 'A') return colWidth * 0.5; // Left (Goal)
            if (pegKey === 'B') return colWidth * 1.5; // Middle
            if (pegKey === 'C') return colWidth * 2.5; // Right (Start)
            return colWidth * 2.5;
        }

        function getPegFromX(x) {
            const stageWidth = stage.clientWidth || 800;
            const colWidth = stageWidth / 3;
            if (x < colWidth) return 'A';
            if (x < colWidth * 2) return 'B';
            return 'C';
        }

        function getDiskY(stackIndex) {
            const stageHeight = stage.clientHeight || 460;
            const baseY = stageHeight - 32; // Above bottom platform
            const diskH = getDiskHeight();
            const gap = 3;
            return baseY - (stackIndex + 1) * (diskH + gap);
        }

        function initGame() {
            cancelActiveDrag();
            isAnimating = false;
            animatingDiskInfo = null;

            numDisks = parseInt(diskSelect.value, 10);
            minMoves = Math.pow(2, numDisks) - 1;


            pegs = {
                'A': [],
                'B': [],
                'C': Array.from({ length: numDisks }, (_, i) => numDisks - i)
            };

            currentMoves = 0;
            historyStack = [];
            activeMode = 'manual';

            updateUI();
            renderBoard();
            winModal.classList.add('hidden');
            warningModal.classList.add('hidden');
        }

        function updateUI() {
            currentMovesDisplay.textContent = currentMoves;
            if (isUnlocked(numDisks)) {
                minMovesContainer.innerHTML = '<span class="text-3xl sm:text-4xl font-extrabold text-emerald-400">' + minMoves + '</span>';
            } else {
                minMovesContainer.innerHTML = '<span class="text-sm text-slate-400">クリア後に表示</span>';
            }
            undoBtn.disabled = historyStack.length === 0 || isAnimating;
            undoBtn.style.opacity = undoBtn.disabled ? '0.5' : '1';
        }

        function renderBoard() {
            disksContainer.innerHTML = '';
            const diskH = getDiskHeight();

            ['A', 'B', 'C'].forEach(pegKey => {
                const stack = pegs[pegKey];
                stack.forEach((diskVal, stackIdx) => {
                    // Hide disk if currently being dragged in block
                    if (isDragging && sourcePeg === pegKey && draggedBlock.includes(diskVal)) {
                        return;
                    }

                    // Hide disk if currently animating
                    if (animatingDiskInfo && animatingDiskInfo.fromPeg === pegKey && animatingDiskInfo.fromStackIdx === stackIdx) {
                        return;
                    }

                    const widthPx = getDiskWidthPx(diskVal);
                    const pegX = getPegX(pegKey);
                    const diskY = getDiskY(stackIdx);

                    const diskEl = document.createElement('div');
                    diskEl.className = `disk-element no-touch-action ${diskVal === 1 ? 'disk-hitbox-1' : ''}`;
                    diskEl.dataset.diskVal = diskVal;
                    diskEl.dataset.pegKey = pegKey;
                    diskEl.dataset.stackIdx = stackIdx;
                    diskEl.style.width = `${widthPx}px`;
                    diskEl.style.height = `${diskH}px`;
                    diskEl.style.left = `${pegX - widthPx / 2}px`;
                    diskEl.style.top = `${diskY}px`;
                    diskEl.style.background = DISK_COLORS[(diskVal - 1) % DISK_COLORS.length];
                    diskEl.textContent = diskVal;

                    const isTopDisk = (stackIdx === stack.length - 1);
                    const canGrab = isTopDisk;

                    if (canGrab && activeMode === 'manual' && !isAnimating) {
                        diskEl.style.cursor = 'grab';
                        diskEl.addEventListener('pointerdown', handlePointerDown);
                    } else {
                        diskEl.style.cursor = 'default';
                    }

                    disksContainer.appendChild(diskEl);
                });
            });
        }

        /**
         * Validates whether all pegs strictly obey Hanoi hierarchy
         */
        function cancelActiveDrag() {
            if (!isDragging) return;
            isDragging = false;
            draggedBlock = [];
            sourcePeg = null;
            dragContainer.innerHTML = '';
            dragContainer.classList.add('hidden');
            targetBeam.classList.add('hidden');
            ['A', 'B', 'C'].forEach(p => {
                document.getElementById(`pegCol-${p}`).classList.remove('peg-target-active');
            });
            window.removeEventListener('pointermove', handlePointerMove);
            window.removeEventListener('pointerup', handlePointerUp);
            window.removeEventListener('pointercancel', handlePointerUp);
            renderBoard();
        }

        function handlePointerDown(e) {
            if (activeMode !== 'manual' || isAnimating) return;

            const diskEl = e.currentTarget;
            sourcePeg = diskEl.dataset.pegKey;
            const stackIdx = parseInt(diskEl.dataset.stackIdx, 10);
            const stack = pegs[sourcePeg];

            if (stackIdx !== stack.length - 1) return;
            draggedBlock = [stack[stackIdx]];

            if (draggedBlock.length === 0) return;

            isDragging = true;
            activePointerId = e.pointerId;

            dragContainer.innerHTML = '';
            dragContainer.classList.remove('hidden');

            const diskH = getDiskHeight();

            draggedBlock.forEach((diskVal, idx) => {
                const widthPx = getDiskWidthPx(diskVal);
                const floatDisk = document.createElement('div');
                floatDisk.className = 'disk-element flying-disk no-touch-action';
                floatDisk.style.width = `${widthPx}px`;
                floatDisk.style.height = `${diskH}px`;
                floatDisk.style.background = DISK_COLORS[(diskVal - 1) % DISK_COLORS.length];
                floatDisk.textContent = diskVal;
                floatDisk.id = `dragged-disk-${diskVal}`;

                dragContainer.appendChild(floatDisk);
            });

            renderBoard();

            updateDragPosition(e.clientX, e.clientY);

            targetBeam.classList.remove('hidden');

            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
            window.addEventListener('pointercancel', handlePointerUp);
        }

        function updateDragPosition(clientX, clientY) {
            const rect = stage.getBoundingClientRect();
            const pointerX = clientX - rect.left;
            const pointerY = clientY - rect.top;

            const diskH = getDiskHeight();
            const gap = 3;

            draggedBlock.forEach((diskVal, idx) => {
                const widthPx = getDiskWidthPx(diskVal);
                const floatDisk = document.getElementById(`dragged-disk-${diskVal}`);
                if (floatDisk) {
                    const itemY = (pointerY - 60) - (diskH / 2) - (idx * (diskH + gap));
                    floatDisk.style.left = `${pointerX - widthPx / 2}px`;
                    floatDisk.style.top = `${itemY}px`;
                }
            });

            updateTargetBeam(pointerX);
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            updateDragPosition(e.clientX, e.clientY);
        }

        function updateTargetBeam(pointerX) {
            const targetPeg = getPegFromX(pointerX);
            const targetX = getPegX(targetPeg);
            targetBeam.style.left = `${targetX - 2}px`;

            ['A', 'B', 'C'].forEach(p => {
                const colEl = document.getElementById(`pegCol-${p}`);
                if (p === targetPeg) {
                    colEl.classList.add('peg-target-active');
                } else {
                    colEl.classList.remove('peg-target-active');
                }
            });
        }

        function handlePointerUp(e) {
            if (!isDragging) return;

            const rect = stage.getBoundingClientRect();
            const pointerX = e.clientX - rect.left;
            const targetPeg = getPegFromX(pointerX);

            const baseDiskVal = draggedBlock[0];
            const targetStack = pegs[targetPeg];

            const isLegal = (targetPeg !== sourcePeg) &&
                (targetStack.length === 0 || targetStack[targetStack.length - 1] > baseDiskVal);

            if (isLegal) {
                if (primaryMode === 'normal') {
                    historyStack.push({
                        from: sourcePeg,
                        to: targetPeg,
                        diskVal: baseDiskVal
                    });
                }

                pegs[sourcePeg] = pegs[sourcePeg].filter(v => !draggedBlock.includes(v));
                pegs[targetPeg].push(...draggedBlock);

                currentMoves++;

                updateUI();
                checkWin();
            }

            cancelActiveDrag();
        }

        function checkWin() {
            if (pegs['A'].length === numDisks) {
                const wasUnlockedBefore = isUnlocked(numDisks);

                if (primaryMode === 'normal') {
                    stats[numDisks].clearCount++;
                    if (currentMoves === minMoves) {
                        stats[numDisks].minCleared = true;
                    }
                }

                const isUnlockedNow = isUnlocked(numDisks);
                updateUI();

                setTimeout(() => {
                    winMoves.textContent = currentMoves;
                    winMinMoves.textContent = isUnlockedNow ? minMoves : '🔒';

                    const reqClears = (numDisks <= 3) ? 3 : 2;
                    const count = stats[numDisks].clearCount;

                    let noticeHTML = '';
                    if (!wasUnlockedBefore && isUnlockedNow) {
                        noticeHTML = `
                            <div class="text-emerald-400 font-bold flex items-center gap-1.5 text-sm mb-1">
                                <i class="fa-solid fa-unlock text-base"></i> 解放条件を達成しました！
                            </div>
                            <div class="text-slate-300">
                                最短手数表示が解禁されました。
                            </div>
                        `;
                    } else if (isUnlockedNow) {
                        noticeHTML = `
                            <div class="text-emerald-300 font-semibold text-xs">
                                <i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> 最短手数表示は解禁済みです。
                            </div>
                        `;
                    } else {
                        const remaining = reqClears - count;
                        noticeHTML = `
                            <div class="text-amber-300 font-bold text-xs mb-1">
                                <i class="fa-solid fa-lock text-amber-400 mr-1"></i> 解放条件未達成 (${count}/${reqClears}回クリア)
                            </div>
                            <div class="text-slate-300 text-xs">
                                最短手数(${minMoves}手)でクリアする、または あと<strong class="text-amber-400 font-bold">${remaining}回</strong>クリアすると「最短手数表示」が解禁されます。
                            </div>
                        `;
                    }

                    winUnlockNotice.innerHTML = noticeHTML;
                    winModal.classList.remove('hidden');
                }, 150);
            }
        }

        // Event listener bindings

        diskSelect.addEventListener('change', () => {
            // Stats strictly retained during disk changes across page session
            initGame();
        });

        resetBtn.addEventListener('click', () => {
            initGame();
        });

        undoBtn.addEventListener('click', () => {
            if (primaryMode !== 'normal' || activeMode !== 'manual' || historyStack.length === 0 || isAnimating) return;
            const lastMove = historyStack.pop();
            const diskVal = pegs[lastMove.to].pop();
            pegs[lastMove.from].push(diskVal);
            currentMoves = Math.max(0, currentMoves - 1);
            updateUI();
            renderBoard();
        });

        winResetBtn.addEventListener('click', () => {
            winModal.classList.add('hidden');
            initGame();
        });

        closeWarningBtn.addEventListener('click', () => {
            warningModal.classList.add('hidden');
        });

        window.addEventListener('resize', () => {
            renderBoard();
        });

        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
