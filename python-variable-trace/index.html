function buildSteps(source){let ast=parseCode(source),env={},output=[],graphs=[],plotting={imported:false,figure:{series:[],title:'',xlabel:'',ylabel:''}},trace=[{line:0,text:'開始前',vars:{},output:[],graphs:[],changed:[]}],n=0;function record(line,text,old){n++;if(n>500)throw Error('500ステップを超えました。無限ループなどを確認してください');let changed=Object.keys(env).filter(k=>!same(env[k],old[k]));trace.push({line,text,vars:{...env},output:[...output],graphs:[...graphs],changed})}function run(nodes){for(let node of nodes){let old={...env};try{if(node.kind==='assign'){env[node.variable]=expr(node.value,env);record(node.line,node.text,old)}else if(node.kind==='print'){output.push(node.args.map(a=>formatPrint(expr(a,env))).join(' '));record(node.line,node.text,old)}else if(node.kind==='plotImport'||node.kind==='plot'){plotCommand(node,env,plotting,graphs);record(node.line,node.text,old)}else if(node.kind==='if'){let hit=false;for(let b of node.branches){let ok=b.cond===null||truth(expr(b.cond,env));record(b.line,b.text,old);if(ok){run(b.body);hit=true;break}}}else if(node.kind==='while'){let c=0;while(true){let ok=truth(expr(node.cond,env));record(node.line,node.text,{...env});if(!ok)break;if(++c>500)throw Error('whileの繰り返し回数が多すぎます');run(node.body)}}else if(node.kind==='for'){let args=node.args.map(a=>expr(a,env));if(!args.every(a=>Number.isInteger(a)))throw Error('rangeには整数を指定してください');let [start,end,step]=args.length===1?[0,args[0],1]:args.length===2?[args[0],args[1],1]:args;if(step===0)throw Error('rangeの増分は0にできません');let count=0;for(let i=start;step>0?i<end:i>end;i+=step){let beforeLoop={...env};env[node.variable]=i;record(node.line,node.text,beforeLoop);if(++count>500)throw Error('forの繰り返し回数が多すぎます');run(node.body)}record(node.line,node.text+'（終了）',{...env})}}catch(e){if(!/^\d+行目:/.test(e.message))throw Error(node.line+'行目: '+e.message);throw e}}}function formatPrint(v){return typeof v==='string'?v:format(v)}run(ast.nodes);return{trace,raw:ast.raw}}
function plotCommand(node, env, plotting, graphs) {

 if(!numeric&&!(node.method==='bar'&&labels))throw Error('折れ線の x は数値、棒グラフの x は数値か文字列のリストにしてください');

 graph.series.forEach((s,seriesIndex)=>{const color=colors[seriesIndex];if(!bar)node('polyline',{points:s.x.map((x,i)=>xPos(x,i)+','+yPos(s.y[i])).join(' '),fill:'none',stroke:color,'stroke-width':3});
  s.x.forEach((x,i)=>{let mark;if(bar){const slot=(right-left)/s.x.length,width=slot*.72/graph.series.length,px=xPos(x,i)-slot*.36+seriesIndex*width;mark=node('rect',{x:px,y:Math.min(base,yPos(s.y[i])),width:Math.max(.5,width-1),height:Math.abs(base-yPos(s.y[i])),fill:color});}else mark=node('circle',{cx:xPos(x,i),cy:yPos(s.y[i]),r:4,fill:color});const title=document.createElementNS(ns,'title');title.textContent=String(x)+': '+String(s.y[i]);mark.append(title);});

}

function revealCodeLine() {

function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function message(m,type=''){ $('msg').className='status '+type;$('msg').textContent=m}

function clearFileFeedback(){$('fileFeedback').className='file-feedback hidden';$('fileFeedback').textContent=''}
function compile(){try{let result=buildSteps($('source').value);steps=result.trace;lines=result.raw;index=0;lastSource=$('source').value;message('解析完了。'+(steps.length-1)+'ステップで実行できます。','success');render()}catch(e){steps=[];lines=$('source').value.split('\n');index=0;message(e.message,'error');render()}}
function render(){let s=steps[index]||{vars:{},changed:[],output:[],line:0,text:'開始前'};let next=steps[index+1];$('codeView').innerHTML=lines.map((line,i)=>`<div class="line ${s.line===i+1?'done':''} ${next&&next.line===i+1?'active':''}"><span class="num">${i+1}</span><span class="src">${escapeHTML(line)||' '}</span></div>`).join('');revealCodeLine();$('outputText').textContent=s.output.join('\n');renderGraphs(s.graphs||[]);$('executionOutput').classList.toggle('hidden',s.output.length===0&&!(s.graphs||[]).length);$('graphHelp').classList.toggle('hidden',!lines.some(line=>line.trim()==='import matplotlib.pyplot as plt'));let names=Object.keys(s.vars).sort();$('varsHead').innerHTML='<tr>'+names.map(k=>'<th>'+escapeHTML(k)+'</th>').join('')+'</tr>';$('vars').innerHTML='<tr>'+names.map(k=>'<td class="'+(s.changed.includes(k)?'changedCell':'')+'">'+escapeHTML(format(s.vars[k]))+'</td>').join('')+'</tr>';$('emptyVars').classList.toggle('hidden',names.length>0);let traceNames=Array.from(new Set(steps.flatMap(st=>Object.keys(st.vars)))).sort();$('traceHead').innerHTML='<tr><th>ステップ</th>'+traceNames.map(k=>'<th>'+escapeHTML(k)+'</th>').join('')+'<th>実行内容</th></tr>';$('history').innerHTML=steps.slice(1,index+1).map((t,i)=>'<tr class="'+(i+1===index?'current':'')+'"><td>'+(i+1)+'</td>'+traceNames.map(k=>'<td class="'+(t.changed.includes(k)?'changedCell':'')+'">'+(Object.prototype.hasOwnProperty.call(t.vars,k)?escapeHTML(format(t.vars[k])):'—')+'</td>').join('')+'<td>'+escapeHTML(t.text)+'</td></tr>').join('');$('prev').disabled=index===0;$('next').disabled=!next;$('all').disabled=!next;$('position').textContent='ステップ '+index+' / '+Math.max(0,steps.length-1)+(next?' · 次に実行する行：'+next.line+'行目':' · 実行終了');}
function step(){if(index<steps.length-1){index++;render()}}
$('build').addEventListener('click',compile);$('reset').addEventListener('click',compile);$('prev').addEventListener('click',()=>{if(index>0){index--;render()}});$('next').addEventListener('click',step);$('all').addEventListener('click',()=>{index=steps.length-1;render()});$('sample').addEventListener('change',()=>{if(!$('sample').value)return;$('source').value=samples[$('sample').value];currentFileName=$('sample').selectedOptions[0].textContent;updateOpenedName();$('sample').value='';compile()});$('newCode').addEventListener('click',()=>{hideSaveChoices();clearFileFeedback();if($('source').value.trim()&&!confirm('新規作成しますか？ 現在のコードとトレース履歴は消去されます。'))return;currentFileName='';$('source').value='';updateOpenedName();$('openedName').focus();$('sample').selectedIndex=-1;steps=[];index=0;lines=[];lastSource='';$('source').closest('details').open=true;render();message('プログラム名を入力してから、Pythonコードを作成してください。');});function exportRows(){
 let names=Array.from(new Set(steps.flatMap(s=>Object.keys(s.vars)))).sort();
 let rows=[['ステップ',...names,'実行内容']];
 steps.slice(1,index+1).forEach((s,i)=>rows.push([String(i+1),...names.map(k=>k in s.vars?format(s.vars[k]):''),s.text]));
 return rows;
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
 function pdfTextLines(rows){
  const lines=['Python変数トレース','プログラム名: '+(currentFileName||'python_program'),'','[Pythonプログラム]'];
  $('source').value.replace(/\r/g,'').split('\n').forEach((line,i)=>lines.push(String(i+1).padStart(3,' ')+'  '+line));
  if(index>0){
   lines.push('','[トレース表（ステップ '+index+' まで）]');
   rows.forEach(row=>lines.push(row.map(cell=>String(cell)).join('    ')));
  }
  return lines;
 }
 function makePdfFromCanvases(canvases){
  const enc=new TextEncoder(),objects=[],pages=[],parts=[],offsets=[0];let length=0;
  const add=value=>{objects.push(value);return objects.length};
  const addText=text=>{const bytes=enc.encode(text);parts.push(bytes);length+=bytes.length};
  const addBytes=bytes=>{parts.push(bytes);length+=bytes.length};
  const catalog=add(''),pagesObj=add('');
  canvases.forEach((canvas,idx)=>{
   const raw=atob(canvas.toDataURL('image/jpeg',.92).split(',')[1]),bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
   const image=add({type:'image',bytes,width:canvas.width,height:canvas.height});
   const content=add({type:'content',text:'q 595 0 0 842 0 0 cm /Im'+idx+' Do Q'});
   pages.push(add({type:'page',image,content,idx}));
  });
  objects[catalog-1]='<< /Type /Catalog /Pages '+pagesObj+' 0 R >>';
  objects[pagesObj-1]='<< /Type /Pages /Kids ['+pages.map(p=>p+' 0 R').join(' ')+'] /Count '+pages.length+' >>';
  addText('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  objects.forEach((obj,n)=>{
   offsets[n+1]=length;addText((n+1)+' 0 obj\n');
   if(typeof obj==='string')addText(obj+'\n');
   else if(obj.type==='image'){
    addText('<< /Type /XObject /Subtype /Image /Width '+obj.width+' /Height '+obj.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+obj.bytes.length+' >>\nstream\n');addBytes(obj.bytes);addText('\nendstream\n');
   }else if(obj.type==='content'){
    const body=enc.encode(obj.text);addText('<< /Length '+body.length+' >>\nstream\n');addBytes(body);addText('\nendstream\n');
   }else addText('<< /Type /Page /Parent '+pagesObj+' 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im'+obj.idx+' '+obj.image+' 0 R >> >> /Contents '+obj.content+' 0 R >>\n');
   addText('endobj\n');
  });
  const xref=length;addText('xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n');for(let i=1;i<offsets.length;i++)addText(String(offsets[i]).padStart(10,'0')+' 00000 n \n');addText('trailer\n<< /Size '+(objects.length+1)+' /Root '+catalog+' 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
 }
 async function buildPdfBlob(rows){
  await document.fonts.ready;
  const width=1240,height=1754,margin=70,lineHeight=30,fontSize=22,canvases=[];let page;
  function newPage(){const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#173544';ctx.font=fontSize+'px system-ui, sans-serif';ctx.textBaseline='top';page={canvas,ctx,y:margin};canvases.push(canvas)}
  function wrap(text,maxWidth){const result=[];let part='';for(const char of String(text)){if(char==='\n'){result.push(part);part='';continue}if(part&&page.ctx.measureText(part+char).width>maxWidth){result.push(part);part=''}part+=char}result.push(part);return result}
  function line(text){for(const part of wrap(text,width-margin*2)){if(page.y+lineHeight>height-margin)newPage();page.ctx.fillText(part,margin,page.y);page.y+=lineHeight}}
  newPage();
  line('Python変数トレース');line('プログラム名: '+(currentFileName||'python_program'));line('');line('[Pythonプログラム]');
  $('source').value.replace(/\r/g,'').split('\n').forEach((text,i)=>line(String(i+1).padStart(3,' ')+'  '+text));
  if(index>0){
   line('');line('[トレース表（ステップ '+index+' まで）]');
   const columns=rows[0].length,totalWidth=width-margin*2,stepWidth=80,contentWidth=columns>2?totalWidth*.4:totalWidth-stepWidth;
   const widths=rows[0].map((_,i)=>i===0?stepWidth:i===columns-1?contentWidth:(totalWidth-stepWidth-contentWidth)/(columns-2));
   page.ctx.font='18px system-ui, sans-serif';
   function row(cells,header=false){
    const wrapped=cells.map((text,i)=>wrap(text,Math.max(8,widths[i]-16))),count=Math.max(...wrapped.map(parts=>parts.length));
    for(let offset=0;offset<count;){
     if(page.y+28>height-margin){newPage();page.ctx.font='18px system-ui, sans-serif'}
     const fit=Math.min(count-offset,Math.floor((height-margin-page.y-10)/24));
     if(fit<1){newPage();page.ctx.font='18px system-ui, sans-serif';continue}
     const rowHeight=fit*24+10;let x=margin;
     cells.forEach((_,i)=>{page.ctx.fillStyle=header?'#eaf5f2':'#fff';page.ctx.fillRect(x,page.y,widths[i],rowHeight);page.ctx.strokeStyle='#bdceca';page.ctx.strokeRect(x,page.y,widths[i],rowHeight);page.ctx.fillStyle='#173544';wrapped[i].slice(offset,offset+fit).forEach((text,j)=>page.ctx.fillText(text,x+8,page.y+5+j*24));x+=widths[i]});
     page.y+=rowHeight;offset+=fit;
    }
   }
   rows.forEach((cells,i)=>row(cells,i===0));
  }
  const current=steps[index];
  if(current&&current.graphs&&current.graphs.length){
   newPage();line('[実行結果のグラフ]');
   for(const graph of current.graphs){
    const svg=graphFigure(graph).querySelector('svg');svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const markup=new XMLSerializer().serializeToString(svg),url=URL.createObjectURL(new Blob([markup],{type:'image/svg+xml;charset=utf-8'}));
    try{const image=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(Error('グラフ画像を作成できませんでした'));image.src=url;});
     const chartWidth=width-margin*2,chartHeight=chartWidth*380/640;if(page.y+chartHeight>height-margin)newPage();page.ctx.drawImage(image,margin,page.y,chartWidth,chartHeight);page.y+=chartHeight+lineHeight;
    }finally{URL.revokeObjectURL(url);}
   }
  }
  return makePdfFromCanvases(canvases);
 }
 $('choosePdf').addEventListener('click',async()=>{
  hideSaveChoices();clearFileFeedback();syncDocumentTitle();
  try{
   const blob=await buildPdfBlob(exportRows()),name=safePdfFileName(currentFileName);
   if(typeof window.showSaveFilePicker==='function'){
    try{const handle=await window.showSaveFilePicker({id:'innovia-python-pdf',suggestedName:name,types:[{description:'PDFファイル',accept:{'application/pdf':['.pdf']}}]});const writable=await handle.createWritable();await writable.write(blob);await writable.close();fileFeedback('PDFを保存しました。','success');return}catch(err){if(err.name==='AbortError')return}
   }
   const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);fileFeedback('PDFの保存を開始しました。','success');
  }catch(err){fileFeedback('PDFを作成できませんでした: '+err.message,'error')}
 });
function syncDocumentTitle(){
 const name=String($('openedName').value||'').trim().replace(/\.(?:py|pdf)$/i,'').replace(/[\\/:*?"<>|\x00-\x1F]/g,'_').replace(/[. ]+$/g,'');
 document.title=name||'Python変数トレース';
}
function updateOpenedName(){$('openedName').value=currentFileName;$('openedName').title=currentFileName||'プログラム名を入力';syncDocumentTitle()}
$('openedName').addEventListener('input',()=>{currentFileName=$('openedName').value;syncDocumentTitle()});
function hideSaveChoices(){$('saveChoices').classList.add('hidden');$('savePy').setAttribute('aria-expanded','false')}
$('savePy').setAttribute('aria-expanded','false');
$('savePy').setAttribute('aria-controls','saveChoices');
$('savePy').addEventListener('click',()=>{
 const showing=$('saveChoices').classList.contains('hidden');
 clearFileFeedback();$('saveChoices').classList.toggle('hidden',!showing);
 $('savePy').setAttribute('aria-expanded',String(showing));
});
$('cancelSave').addEventListener('click',hideSaveChoices);
let currentFileName='基本：代入と計算';
function safePyFileName(raw){let name=String(raw||'').trim().replace(/\.py$/i,'').replace(/[\\/:*?"<>|\x00-\x1F]/g,'_').replace(/[. ]+$/g,'');return(name||'python_program')+'.py'}
function safePdfFileName(raw){let name=String(raw||'').trim().replace(/\.pdf$/i,'').replace(/[\\/:*?"<>|\x00-\x1F]/g,'_').replace(/[. ]+$/g,'');return(name||'python_program')+'.pdf'}
$('choosePy').addEventListener('click',async()=>{
 hideSaveChoices();clearFileFeedback();
 if(!currentFileName.trim()){fileFeedback('先にプログラム名を入力してください。','error');$('openedName').focus();return}
 const name=safePyFileName(currentFileName),content=$('source').value;
 // 「フォルダーの選択」ではなく「名前を付けて保存」を表示する。
 // 同じ id を指定すると、対応ブラウザは前回使ったフォルダを初期候補にできる。
 if(typeof window.showSaveFilePicker==='function'){
  try{
   const handle=await window.showSaveFilePicker({
    id:'innovia-python-projects',
    suggestedName:name,
    types:[{description:'Pythonプログラム (.py)',accept:{'text/x-python':['.py']}}]
   });
   const writable=await handle.createWritable();
   await writable.write(content);await writable.close();
   currentFileName=handle.name.replace(/\.py$/i,'');updateOpenedName();
   fileFeedback('保存しました。','success');
   return;
  }catch(err){
   if(err.name==='AbortError')return;
   fileFeedback('直接保存が利用できないため、ダウンロード方式に切り替えます。');
  }
 }
 // 最終手段はダウンロード。保存先はブラウザ設定に従う。
 const blob=new Blob([content],{type:'text/x-python;charset=utf-8'});
 const url=URL.createObjectURL(blob);const link=document.createElement('a');
 link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 fileFeedback('保存を開始しました。','success');
});
$('openPy').addEventListener('click',()=>{hideSaveChoices();clearFileFeedback();$('fileInput').value='';$('fileInput').click()});
$('fileInput').addEventListener('change',async(e)=>{
 const file=e.target.files&&e.target.files[0];if(!file)return;
 if($('source').value.trim()&&!confirm('現在のコードを、選択したファイルの内容に置き換えますか？ 未保存の変更は失われます。'))return;
 try{
  const code=await file.text();
  $('source').value=code.replace(/^\uFEFF/,'');
  currentFileName=file.name.replace(/\.py$/i,'');updateOpenedName();
  $('sample').selectedIndex=-1;
  $('source').closest('details').open=true;
  compile();
  fileFeedback('読み込みました。','success');
 }catch(err){fileFeedback('読み込めませんでした: '+err.message,'error')}
});

updateOpenedName();
$('source').addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();let a=e.target,p=a.selectionStart;a.setRangeText('    ',p,a.selectionEnd,'end')}});$('source').value=samples.basic;compile();
})();
