<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const samples={basic:'x = 3\ny = 2\nx = x + y\ny = x * 2\nprint(y)',loop:'total = 0\nfor i in range(1, 5):\n    total = total + i\nprint(total)',branch:'score = 75\nif score >= 80:\n    result = "合格"\nelse:\n    result = "もう少し"\nprint(result)',while:'n = 1\nwhile n < 10:\n    n = n * 2\nprint(n)',nested:'total = 0\nfor i in range(1, 6):\n    if i % 2 == 0:\n        total = total + i\nprint(total)'};
Object.assign(samples,{"graphLine":"import matplotlib.pyplot as plt\n\nx = [1, 2, 3, 4, 5]\ny = [2, 4, 3, 7, 6]\nplt.plot(x, y)\nplt.title(\"変化を折れ線で見る\")\nplt.xlabel(\"回数\")\nplt.ylabel(\"値\")\nplt.show()","graphBar":"import matplotlib.pyplot as plt\n\nlabels = [\"A\", \"B\", \"C\", \"D\"]\nvalues = [3, 7, 5, 4]\nplt.bar(labels, values)\nplt.title(\"値を棒グラフで比べる\")\nplt.xlabel(\"項目\")\nplt.ylabel(\"値\")\nplt.show()"});
let steps=[],index=0,lines=[],lastSource='';
function format(v){if(Array.isArray(v))return '['+v.map(format).join(', ')+']';if(typeof v==='string')return JSON.stringify(v);if(typeof v==='boolean')return v?'True':'False';if(v===null)return 'None';return String(v)}
function reprVars(v){return Object.keys(v).sort().map(k=>k+'='+format(v[k])).join(', ')||'—'}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function tokenize(s){let out=[],re=/\s+|(?:\d+(?:\.\d*)?|\.\d+)|(?:"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(?:==|!=|<=|>=|\/\/|\*\*)|[A-Za-z_]\w*|./gy,m;while((m=re.exec(s))){let t=m[0];if(/^\s+$/.test(t))continue;if(!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(t)&&!/^['"]/.test(t)&&!/^(?:==|!=|<=|>=|\/\/|\*\*|[A-Za-z_]\w*|[+*\/%()\[\]\-,<>])$/.test(t))throw Error('未対応の記号: '+t);out.push(t)}return out}
function truth(v){return Array.isArray(v)?v.length>0:Boolean(v)}
function expr(s,env){
 const ts=tokenize(s);let p=0;
 const prec={'or':1,'and':2,'==':3,'!=':3,'<':3,'>':3,'<=':3,'>=':3,'+':4,'-':4,'*':5,'/':5,'//':5,'%':5,'**':7};
 const peek=()=>ts[p],take=()=>ts[p++];
 // Parse skipped operands too, but do not evaluate their names or arithmetic.
 function parse(min=0,execute=true){
  const t=take();let lhs;
  if(t===undefined)throw Error('式が途中で終わっています');
  if(t==='('){lhs=parse(0,execute);if(take()!==')')throw Error(') が必要です');}
  else if(t==='['){const values=[];if(peek()!==']'){while(true){if(values.length>=100)throw Error('リストは100個までです');const value=parse(0,execute);if(execute){if(Array.isArray(value))throw Error('入れ子のリストには対応していません');values.push(value);}if(peek()!==',')break;take();if(peek()===']')break;}}if(take()!==']')throw Error('] が必要です');if(execute)lhs=values;}
  else if(t==='-'||t==='+'||t==='not'){
   // Python: power binds more tightly than a unary sign on its left.
   const v=parse(t==='not'?3:6,execute);if(execute&&Array.isArray(v)&&t!=='not')throw Error('リストに符号は付けられません');if(execute)lhs=t==='not'?!truth(v):t==='-'?-v:+v;
  }
  else if(/^\d/.test(t)||/^\.\d/.test(t)){if(execute)lhs=Number(t);}
  else if(/^['"]/.test(t)){
   try{const value=JSON.parse(t[0]==='"'?t:'"'+t.slice(1,-1).replace(/\\'/g,"'").replace(/"/g,'\\"')+'"');if(execute)lhs=value;}catch{throw Error('文字列を確認してください');}
  }
  else if(t==='True'){if(execute)lhs=true;}
  else if(t==='False'){if(execute)lhs=false;}
  else if(t==='None'){if(execute)lhs=null;}
  else if(/^[A-Za-z_]\w*$/.test(t)&&!['and','or'].includes(t)){
   if(execute){if(!Object.prototype.hasOwnProperty.call(env,t))throw Error('未定義の変数: '+t);lhs=env[t];}
  }
  else throw Error('式に使えない記号: '+t);
  while(prec[peek()]!==undefined&&prec[peek()]>=min){
   const op=take(),skip=execute&&((op==='and'&&!truth(lhs))||(op==='or'&&truth(lhs)));
   const v=parse(prec[op]+(op==='**'?0:1),execute&&!skip);
   if(!execute||skip)continue;
   if((Array.isArray(lhs)||Array.isArray(v))&&!['and','or','==','!=','+'].includes(op))throw Error("この演算にはリストを使えません");
   switch(op){
    // Python and/or return the selected operand, rather than a Boolean cast.
    case 'or':case 'and':lhs=v;break;
    case '==':lhs=Array.isArray(lhs)&&Array.isArray(v)?same(lhs,v):lhs===v;break;case '!=':lhs=Array.isArray(lhs)&&Array.isArray(v)?!same(lhs,v):lhs!==v;break;
    case '<':lhs=lhs<v;break;case '>':lhs=lhs>v;break;case '<=':lhs=lhs<=v;break;case '>=':lhs=lhs>=v;break;
    case '+':if(Array.isArray(lhs)||Array.isArray(v)){if(!Array.isArray(lhs)||!Array.isArray(v))throw Error('リスト同士を足してください');if(lhs.length+v.length>100)throw Error('リストは100個までです');lhs=lhs.concat(v);}else lhs=lhs+v;break;case '-':lhs=lhs-v;break;case '*':lhs=lhs*v;break;
    case '/':if(v===0)throw Error('0で割ることはできません');lhs=lhs/v;break;
    case '//':if(v===0)throw Error('0で割ることはできません');lhs=Math.floor(lhs/v);break;
    case '%':if(v===0)throw Error('0で割ることはできません');lhs=((lhs%v)+v)%v;break;
    case '**':lhs=lhs**v;break;
   }
   if(typeof lhs==='number'&&!Number.isFinite(lhs))throw Error('計算結果が大きすぎます');
  }
  return lhs;
 }
 const result=parse();if(p!==ts.length)throw Error('式を読み取れません: '+ts.slice(p).join(' '));return result;
}
function splitArgs(s){let dep=0,q='',start=0,out=[];for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='\\')i++;else if(c===q)q='';continue}if(c==='"'||c==="'")q=c;else if(c==='('||c==='[')dep++;else if(c===')'||c===']')dep--;else if(c===','&&dep===0){out.push(s.slice(start,i).trim());start=i+1}}out.push(s.slice(start).trim());return out.filter(x=>x!=='')}
function parseCode(source){
 const raw=source.replace(/\r/g,'').split('\n');
 const ls=raw.map((s,i)=>{const indent=(s.match(/^ */)||[''])[0].length;if(s.includes('\t'))throw Error((i+1)+'行目: インデントにはスペースを使ってください');if(indent%4)throw Error((i+1)+'行目: インデントはスペース4個単位です');return{text:s.trim(),indent,line:i+1}});
 function block(start,depth){let pos=start,nodes=[];
  while(pos<ls.length){let x=ls[pos],t=x.text;
   if(!t||t.startsWith('#')){pos++;continue}
   if(x.indent<depth)break;
   if(x.indent>depth)throw Error(x.line+'行目: インデントが不正です');
   if(/^elif\b/.test(t)||t==='else:')break;
   let node={line:x.line,text:t};
   let control=t.match(/^(if|while)\s+(.+):$/);
   let forMatch=t.match(/^for\s+([A-Za-z_]\w*)\s+in\s+range\((.*)\):$/);
   if(control){
    node.kind=control[1];node.cond=control[2];
    let child=block(pos+1,depth+4);if(!child.nodes.length)throw Error(x.line+'行目: ブロックが空です');
    node.body=child.nodes;pos=child.pos;
    if(node.kind==='if'){
     node.branches=[{cond:node.cond,body:node.body,line:x.line,text:t}];
     while(pos<ls.length){let nx=ls[pos];if(!nx.text||nx.text.startsWith('#')){pos++;continue}if(nx.indent!==depth)break;
      let elif=nx.text.match(/^elif\s+(.+):$/),isElse=nx.text==='else:';
      if(!elif&&!isElse)break;
      let c=block(pos+1,depth+4);if(!c.nodes.length)throw Error(nx.line+'行目: ブロックが空です');
      node.branches.push({cond:isElse?null:elif[1],body:c.nodes,line:nx.line,text:nx.text});pos=c.pos;
      if(isElse)break;
     }
    }
   }else if(forMatch){
    node.kind='for';node.variable=forMatch[1];node.args=splitArgs(forMatch[2]);
    if(node.args.length<1||node.args.length>3)throw Error(x.line+'行目: rangeの引数は1～3個です');
    let c=block(pos+1,depth+4);if(!c.nodes.length)throw Error(x.line+'行目: ブロックが空です');node.body=c.nodes;pos=c.pos;
    }else if(t==='import matplotlib.pyplot as plt'){
    node.kind='plotImport';pos++;
   }else if(/^plt\.(plot|bar|title|xlabel|ylabel|show)\s*\(.*\)$/.test(t)){
    const command=t.match(/^plt\.(\w+)\s*\((.*)\)$/);node.kind='plot';node.method=command[1];node.args=splitArgs(command[2]);pos++;
   }else if(/^print\s*\(.*\)$/.test(t)){
    node.kind='print';node.args=splitArgs(t.replace(/^print\s*\(/,'').slice(0,-1));pos++;
   }else{
    let assignment=t.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if(!assignment)throw Error(x.line+'行目: 対応していない文です: '+t);
    node.kind='assign';node.variable=assignment[1];node.value=assignment[2];pos++;
   }
   nodes.push(node);
  }
  return{nodes,pos};
 }
 let result=block(0,0),leftover=ls.slice(result.pos).find(x=>x.text&&!x.text.startsWith('#'));
 if(leftover)throw Error(leftover.line+'行目: elif / else またはインデントの位置を確認してください');

}
function buildSteps(source){let ast=parseCode(source),env={},output=[],graphs=[],plotting={imported:false,figure:{series:[],title:'',xlabel:'',ylabel:''}},trace=[{line:0,text:'開始前',vars:{},output:[],graphs:[],changed:[]}],n=0;function record(line,text,old){n++;if(n>500)throw Error('500ステップを超えました。無限ループなどを確認してください');let changed=Object.keys(env).filter(k=>!same(env[k],old[k]));trace.push({line,text,vars:{...env},output:[...output],graphs:[...graphs],changed})}function run(nodes){for(let node of nodes){let old={...env};try{if(node.kind==='assign'){env[node.variable]=expr(node.value,env);record(node.line,node.text,old)}else if(node.kind==='print'){output.push(node.args.map(a=>formatPrint(expr(a,env))).join(' '));record(node.line,node.text,old)}else if(node.kind==='plotImport'||node.kind==='plot'){plotCommand(node,env,plotting,graphs);record(node.line,node.text,old)}else if(node.kind==='if'){let hit=false;for(let b of node.branches){let ok=b.cond===null||truth(expr(b.cond,env));record(b.line,b.text,old);if(ok){run(b.body);hit=true;break}}}else if(node.kind==='while'){let c=0;while(true){let ok=truth(expr(node.cond,env));record(node.line,node.text,{...env});if(!ok)break;if(++c>500)throw Error('whileの繰り返し回数が多すぎます');run(node.body)}}else if(node.kind==='for'){let args=node.args.map(a=>expr(a,env));if(!args.every(a=>Number.isInteger(a)))throw Error('rangeには整数を指定してください');let [start,end,step]=args.length===1?[0,args[0],1]:args.length===2?[args[0],args[1],1]:args;if(step===0)throw Error('rangeの増分は0にできません');let count=0;for(let i=start;step>0?i<end:i>end;i+=step){let beforeLoop={...env};env[node.variable]=i;record(node.line,node.text,beforeLoop);if(++count>500)throw Error('forの繰り返し回数が多すぎます');run(node.body)}record(node.line,node.text+'（終了）',{...env})}}catch(e){if(!/^\d+行目:/.test(e.message))throw Error(node.line+'行目: '+e.message);throw e}}}function formatPrint(v){return typeof v==='string'?v:format(v)}run(ast.nodes);return{trace,raw:ast.raw}}
function plotCommand(node, env, plotting, graphs) {
 if(node.kind==='plotImport'){plotting.imported=true;return;}
 if(!plotting.imported)throw Error('先に import matplotlib.pyplot as plt を書いてください');
 const args=node.args.map(a=>expr(a,env));

 const contentMinimum=Math.min(240,Math.max(80,available*.4)),reserve=Math.min(contentMinimum,Math.max(80,available-stepWidth-56*names.length)),budget=Math.max(0,available-stepWidth-reserve),total=wanted.reduce((sum,w)=>sum+w,0);
 let widths=wanted;

 function makePdfFromCanvases(canvases){

  const addText=text=>{const bytes=enc.encode(text);parts.push(bytes);length+=bytes.length};
  const addBytes=bytes=>{parts.push(bytes);length+=bytes.length};
  const catalog=add(''),pagesObj=add('');
  canvases.forEach((canvas,idx)=>{
   const raw=atob(canvas.toDataURL('image/jpeg',.92).split(',')[1]),bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
   const image=add({type:'image',bytes,width:canvas.width,height:canvas.height});
   const content=add({type:'content',text:'q 595 0 0 842 0 0 cm /Im'+idx+' Do Q'});

  });

 async function buildPdfBlob(rows){
  await document.fonts.ready;

  function newPage(){const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#173544';ctx.font=fontSize+'px system-ui, sans-serif';ctx.textBaseline='top';page={canvas,ctx,y:margin};canvases.push(canvas)}

  function line(text){for(const part of wrap(text,width-margin*2)){if(page.y+lineHeight>height-margin)newPage();page.ctx.fillText(part,margin,page.y);page.y+=lineHeight}}
  newPage();
  line('Python変数トレース');line('プログラム名: '+(currentFileName||'python_program'));line('');line('[Pythonプログラム]');
  $('source').value.replace(/\r/g,'').split('\n').forEach((text,i)=>line(String(i+1).padStart(3,' ')+'  '+text));
  if(index>0){
   line('');line('[トレース表（ステップ '+index+' まで）]');
   const columns=rows[0].length,totalWidth=width-margin*2,stepWidth=80,contentWidth=columns>2?totalWidth*.4:totalWidth-stepWidth;
   const widths=rows[0].map((_,i)=>i===0?stepWidth:i===columns-1?contentWidth:(totalWidth-stepWidth-contentWidth)/(columns-2));
   page.ctx.font='18px system-ui, sans-serif';
   function row(cells,header=false){
    const wrapped=cells.map((text,i)=>wrap(text,Math.max(8,widths[i]-16))),count=Math.max(...wrapped.map(parts=>parts.length));
    for(let offset=0;offset<count;){
     if(page.y+28>height-margin){newPage();page.ctx.font='18px system-ui, sans-serif'}
     const fit=Math.min(count-offset,Math.floor((height-margin-page.y-10)/24));
     if(fit<1){newPage();page.ctx.font='18px system-ui, sans-serif';continue}
     const rowHeight=fit*24+10;let x=margin;
     cells.forEach((_,i)=>{page.ctx.fillStyle=header?'#eaf5f2':'#fff';page.ctx.fillRect(x,page.y,widths[i],rowHeight);page.ctx.strokeStyle='#bdceca';page.ctx.strokeRect(x,page.y,widths[i],rowHeight);page.ctx.fillStyle='#173544';wrapped[i].slice(offset,offset+fit).forEach((text,j)=>page.ctx.fillText(text,x+8,page.y+5+j*24));x+=widths[i]});
     page.y+=rowHeight;offset+=fit;
    }
   }
   rows.forEach((cells,i)=>row(cells,i===0));
  }

  if(current&&current.graphs&&current.graphs.length){
   newPage();line('[実行結果のグラフ]');
   for(const graph of current.graphs){
    const svg=graphFigure(graph).querySelector('svg');svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const markup=new XMLSerializer().serializeToString(svg),url=URL.createObjectURL(new Blob([markup],{type:'image/svg+xml;charset=utf-8'}));
    try{const image=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(Error('グラフ画像を作成できませんでした'));image.src=url;});
     const chartWidth=width-margin*2,chartHeight=chartWidth*380/640;if(page.y+chartHeight>height-margin)newPage();page.ctx.drawImage(image,margin,page.y,chartWidth,chartHeight);page.y+=chartHeight+lineHeight;
    }finally{URL.revokeObjectURL(url);}
   }
  }
  return makePdfFromCanvases(canvases);
 }
