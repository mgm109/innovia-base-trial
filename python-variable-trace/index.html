function expr(s,env){let ts=tokenize(s),p=0;function peek(){return ts[p]}function take(){return ts[p++]}function parse(min=0){let t=take(),lhs;if(t===undefined)throw Error('式が途中で終わっています');if(t==='('){lhs=parse();if(take()!==')')throw Error(') が必要です')}else if(t==='-'||t==='+'||t==='not'){let v=parse(t==='not'?3:8);lhs=t==='not'?!v:t==='-'?-v:+v}else if(/^\d/.test(t)||/^\.\d/.test(t))lhs=Number(t);else if(/^['"]/.test(t)){try{lhs=JSON.parse(t[0]==='"'?t:'"'+t.slice(1,-1).replace(/\\'/g,"'").replace(/"/g,'\\"')+'"')}catch{throw Error('文字列を確認してください')}}else if(t==='True')lhs=true;else if(t==='False')lhs=false;else if(t==='None')lhs=null;else if(/^[A-Za-z_]\w*$/.test(t)){if(!Object.prototype.hasOwnProperty.call(env,t))throw Error('未定義の変数: '+t);lhs=env[t]}else throw Error('式に使えない記号: '+t);
const prec={'or':1,'and':2,'==':3,'!=':3,'<':3,'>':3,'<=':3,'>=':3,'+':4,'-':4,'*':5,'/':5,'//':5,'%':5,'**':7};while(prec[peek()]!==undefined&&prec[peek()]>=min){let op=take(),v=parse(prec[op]+(op==='**'?0:1));switch(op){case 'or':lhs=Boolean(lhs||v);break;case 'and':lhs=Boolean(lhs&&v);break;case '==':lhs=lhs===v;break;case '!=':lhs=lhs!==v;break;case '<':lhs=lhs<v;break;case '<=':lhs=lhs<=v;break;case '>':lhs=lhs>v;break;case '>=':lhs=lhs>=v;break;case '+':lhs=lhs+v;break;case '-':lhs=lhs-v;break;case '*':lhs=lhs*v;break;case '/':if(v===0)throw Error('0で割ることはできません');lhs=lhs/v;break;case '//':if(v===0)throw Error('0で割ることはできません');lhs=Math.floor(lhs/v);break;case '%':if(v===0)throw Error('0で割ることはできません');lhs=((lhs%v)+v)%v;break;case '**':lhs=lhs**v;break}if(typeof lhs==='number'&&!Number.isFinite(lhs))throw Error('計算結果が大きすぎます')}return lhs}let result=parse();if(p!==ts.length)throw Error('式を読み取れません: '+ts.slice(p).join(' '));return result}
function splitArgs(s){let dep=0,q='',start=0,out=[];for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='\\')i++;else if(c===q)q='';continue}if(c==='"'||c==="'")q=c;else if(c==='(')dep++;else if(c===')')dep--;else if(c===','&&dep===0){out.push(s.slice(start,i).trim());start=i+1}}out.push(s.slice(start).trim());return out.filter(x=>x!=='')}
function parseCode(source){
 const raw=source.replace(/\r/g,'').split('\n');
 const ls=raw.map((s,i)=>{const indent=(s.match(/^ */)||[''])[0].length;if(s.includes('\t'))throw Error((i+1)+'行目: インデントにはスペースを使ってください');if(indent%4)throw Error((i+1)+'行目: インデントはスペース4個単位です');return{text:s.trim(),indent,line:i+1}});
 function block(start,depth){let pos=start,nodes=[];
  while(pos<ls.length){let x=ls[pos],t=x.text;
   if(!t||t.startsWith('#')){pos++;continue}
   if(x.indent<depth)break;
   if(x.indent>depth)throw Error(x.line+'行目: インデントが不正です');
   if(/^elif\b/.test(t)||t==='else:')break;
   let node={line:x.line,text:t};
   let control=t.match(/^(if|while)\s+(.+):$/);
   let forMatch=t.match(/^for\s+([A-Za-z_]\w*)\s+in\s+range\((.*)\):$/);
   if(control){
    node.kind=control[1];node.cond=control[2];
    let child=block(pos+1,depth+4);if(!child.nodes.length)throw Error(x.line+'行目: ブロックが空です');
    node.body=child.nodes;pos=child.pos;
    if(node.kind==='if'){
     node.branches=[{cond:node.cond,body:node.body,line:x.line,text:t}];
     while(pos<ls.length){let nx=ls[pos];if(!nx.text||nx.text.startsWith('#')){pos++;continue}if(nx.indent!==depth)break;
      let elif=nx.text.match(/^elif\s+(.+):$/),isElse=nx.text==='else:';
      if(!elif&&!isElse)break;
      let c=block(pos+1,depth+4);if(!c.nodes.length)throw Error(nx.line+'行目: ブロックが空です');
      node.branches.push({cond:isElse?null:elif[1],body:c.nodes,line:nx.line,text:nx.text});pos=c.pos;
      if(isElse)break;
     }
    }
   }else if(forMatch){
    node.kind='for';node.variable=forMatch[1];node.args=splitArgs(forMatch[2]);
    if(node.args.length<1||node.args.length>3)throw Error(x.line+'行目: rangeの引数は1～3個です');
    let c=block(pos+1,depth+4);if(!c.nodes.length)throw Error(x.line+'行目: ブロックが空です');node.body=c.nodes;pos=c.pos;
   }else if(/^print\s*\(.*\)$/.test(t)){
    node.kind='print';node.args=splitArgs(t.replace(/^print\s*\(/,'').slice(0,-1));pos++;
   }else{
    let assignment=t.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if(!assignment)throw Error(x.line+'行目: 対応していない文です: '+t);
    node.kind='assign';node.variable=assignment[1];node.value=assignment[2];pos++;
   }
   nodes.push(node);
  }
  return{nodes,pos};
 }
 let result=block(0,0),leftover=ls.slice(result.pos).find(x=>x.text&&!x.text.startsWith('#'));
 if(leftover)throw Error(leftover.line+'行目: elif / else またはインデントの位置を確認してください');
 return{nodes:result.nodes,raw};
}
function buildSteps(source){let ast=parseCode(source),env={},output=[],trace=[{line:0,text:'開始前',vars:{},output:[],changed:[]}],n=0;function record(line,text,old){n++;if(n>500)throw Error('500ステップを超えました。無限ループなどを確認してください');let changed=Object.keys(env).filter(k=>!same(env[k],old[k]));trace.push({line,text,vars:{...env},output:[...output],changed})}function run(nodes){for(let node of nodes){let old={...env};try{if(node.kind==='assign'){env[node.variable]=expr(node.value,env);record(node.line,node.text,old)}else if(node.kind==='print'){output.push(node.args.map(a=>formatPrint(expr(a,env))).join(' '));record(node.line,node.text,old)}else if(node.kind==='if'){let hit=false;for(let b of node.branches){let ok=b.cond===null||Boolean(expr(b.cond,env));record(b.line,b.text,old);if(ok){run(b.body);hit=true;break}}}else if(node.kind==='while'){let c=0;while(true){let ok=Boolean(expr(node.cond,env));record(node.line,node.text,{...env});if(!ok)break;if(++c>500)throw Error('whileの繰り返し回数が多すぎます');run(node.body)}}else if(node.kind==='for'){let args=node.args.map(a=>expr(a,env));if(!args.every(a=>Number.isInteger(a)))throw Error('rangeには整数を指定してください');let [start,end,step]=args.length===1?[0,args[0],1]:args.length===2?[args[0],args[1],1]:args;if(step===0)throw Error('rangeの増分は0にできません');let count=0;for(let i=start;step>0?i<end:i>end;i+=step){let beforeLoop={...env};env[node.variable]=i;record(node.line,node.text,beforeLoop);if(++count>500)throw Error('forの繰り返し回数が多すぎます');run(node.body)}record(node.line,node.text+'（終了）',{...env})}}catch(e){if(!/^\d+行目:/.test(e.message))throw Error(node.line+'行目: '+e.message);throw e}}}function formatPrint(v){return typeof v==='string'?v:format(v)}run(ast.nodes);return{trace,raw:ast.raw}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function message(m,type=''){ $('msg').className='status '+type;$('msg').textContent=m}

function clearFileFeedback(){$('fileFeedback').className='file-feedback hidden';$('fileFeedback').textContent=''}
function compile(){try{let result=buildSteps($('source').value);steps=result.trace;lines=result.raw;index=0;lastSource=$('source').value;message('解析完了。'+(steps.length-1)+'ステップで実行できます。','success');render()}catch(e){steps=[];lines=$('source').value.split('\n');index=0;message(e.message,'error');render()}}
function render(){let s=steps[index]||{vars:{},changed:[],output:[],line:0,text:'開始前'};let next=steps[index+1];$('codeView').innerHTML=lines.map((line,i)=>`<div class="line ${s.line===i+1?'done':''} ${next&&next.line===i+1?'active':''}"><span class="num">${i+1}</span><span class="src">${escapeHTML(line)||' '}</span></div>`).join('');let names=Object.keys(s.vars).sort();$('varsHead').innerHTML='<tr>'+names.map(k=>'<th>'+escapeHTML(k)+'</th>').join('')+'</tr>';$('vars').innerHTML='<tr>'+names.map(k=>'<td class="'+(s.changed.includes(k)?'changedCell':'')+'">'+escapeHTML(format(s.vars[k]))+'</td>').join('')+'</tr>';$('emptyVars').classList.toggle('hidden',names.length>0);let traceNames=Array.from(new Set(steps.flatMap(st=>Object.keys(st.vars)))).sort();$('traceHead').innerHTML='<tr><th>ステップ</th>'+traceNames.map(k=>'<th>'+escapeHTML(k)+'</th>').join('')+'<th>実行内容</th></tr>';$('history').innerHTML=steps.slice(1,index+1).map((t,i)=>'<tr class="'+(i+1===index?'current':'')+'"><td>'+(i+1)+'</td>'+traceNames.map(k=>'<td class="'+(t.changed.includes(k)?'changedCell':'')+'">'+(Object.prototype.hasOwnProperty.call(t.vars,k)?escapeHTML(format(t.vars[k])):'—')+'</td>').join('')+'<td>'+escapeHTML(t.text)+'</td></tr>').join('');$('prev').disabled=index===0;$('next').disabled=!next;$('all').disabled=!next;$('position').textContent='ステップ '+index+' / '+Math.max(0,steps.length-1)+(next?' · 次に実行する行：'+next.line+'行目':' · 実行終了');}
function step(){if(index<steps.length-1){index++;render()}}
$('build').addEventListener('click',compile);$('reset').addEventListener('click',compile);$('prev').addEventListener('click',()=>{if(index>0){index--;render()}});$('next').addEventListener('click',step);$('all').addEventListener('click',()=>{index=steps.length-1;render()});$('sample').addEventListener('change',()=>{if(!$('sample').value)return;$('source').value=samples[$('sample').value];currentFileName=$('sample').selectedOptions[0].textContent;updateOpenedName();$('sample').value='';compile()});$('newCode').addEventListener('click',()=>{hideSaveChoices();clearFileFeedback();if($('source').value.trim()&&!confirm('新規作成しますか？ 現在のコードとトレース履歴は消去されます。'))return;currentFileName='';$('source').value='';updateOpenedName();$('openedName').focus();$('sample').selectedIndex=-1;steps=[];index=0;lines=[];lastSource='';$('source').closest('details').open=true;render();message('プログラム名を入力してから、Pythonコードを作成してください。');});function exportRows(){
 let names=Array.from(new Set(steps.flatMap(s=>Object.keys(s.vars)))).sort();
 let rows=[['ステップ',...names,'実行内容']];
 steps.slice(1,index+1).forEach((s,i)=>rows.push([String(i+1),...names.map(k=>k in s.vars?format(s.vars[k]):''),s.text]));
 return rows;
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
 function pdfTextLines(rows){
  const lines=['Python変数トレース','プログラム名: '+(currentFileName||'python_program'),'','[Pythonプログラム]'];
  $('source').value.replace(/\r/g,'').split('\n').forEach((line,i)=>lines.push(String(i+1).padStart(3,' ')+'  '+line));
  if(index>0){

   rows.forEach(row=>lines.push(row.map(cell=>String(cell)).join('    ')));
  }
  return lines;
 }
 function makePdfFromCanvases(canvases){
  const enc=new TextEncoder(),objects=[],pages=[],parts=[],offsets=[0];let length=0;
  const add=value=>{objects.push(value);return objects.length};
  const addText=text=>{const bytes=enc.encode(text);parts.push(bytes);length+=bytes.length};
  const addBytes=bytes=>{parts.push(bytes);length+=bytes.length};
  const catalog=add(''),pagesObj=add('');
  canvases.forEach((canvas,idx)=>{
   const raw=atob(canvas.toDataURL('image/jpeg',.92).split(',')[1]),bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
   const image=add({type:'image',bytes,width:canvas.width,height:canvas.height});
   const content=add({type:'content',text:'q 595 0 0 842 0 0 cm /Im'+idx+' Do Q'});
   pages.push(add({type:'page',image,content,idx}));
  });
  objects[catalog-1]='<< /Type /Catalog /Pages '+pagesObj+' 0 R >>';
  objects[pagesObj-1]='<< /Type /Pages /Kids ['+pages.map(p=>p+' 0 R').join(' ')+'] /Count '+pages.length+' >>';
  addText('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  objects.forEach((obj,n)=>{
   offsets[n+1]=length;addText((n+1)+' 0 obj\n');
   if(typeof obj==='string')addText(obj+'\n');
   else if(obj.type==='image'){
    addText('<< /Type /XObject /Subtype /Image /Width '+obj.width+' /Height '+obj.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+obj.bytes.length+' >>\nstream\n');addBytes(obj.bytes);addText('\nendstream\n');
   }else if(obj.type==='content'){
    const body=enc.encode(obj.text);addText('<< /Length '+body.length+' >>\nstream\n');addBytes(body);addText('\nendstream\n');
   }else addText('<< /Type /Page /Parent '+pagesObj+' 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im'+obj.idx+' '+obj.image+' 0 R >> >> /Contents '+obj.content+' 0 R >>\n');
   addText('endobj\n');
  });
  const xref=length;addText('xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n');for(let i=1;i<offsets.length;i++)addText(String(offsets[i]).padStart(10,'0')+' 00000 n \n');addText('trailer\n<< /Size '+(objects.length+1)+' /Root '+catalog+' 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
 }
 async function buildPdfBlob(rows){
  await document.fonts.ready;
  const width=1240,height=1754,margin=70,lineHeight=30,fontSize=22,canvases=[];let page;
  function newPage(){const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#173544';ctx.font=fontSize+'px system-ui, sans-serif';ctx.textBaseline='top';page={canvas,ctx,y:margin};canvases.push(canvas)}
  function wrap(text,maxWidth){const result=[];let part='';for(const char of String(text)){if(char==='\n'){result.push(part);part='';continue}if(part&&page.ctx.measureText(part+char).width>maxWidth){result.push(part);part=''}part+=char}result.push(part);return result}
  function line(text){for(const part of wrap(text,width-margin*2)){if(page.y+lineHeight>height-margin)newPage();page.ctx.fillText(part,margin,page.y);page.y+=lineHeight}}
  newPage();
  line('Python変数トレース');line('プログラム名: '+(currentFileName||'python_program'));line('');line('[Pythonプログラム]');
  $('source').value.replace(/\r/g,'').split('\n').forEach((text,i)=>line(String(i+1).padStart(3,' ')+'  '+text));
  if(index>0){
   line('');line('[トレース表（ステップ '+index+' まで）]');
   const columns=rows[0].length,totalWidth=width-margin*2,stepWidth=80,contentWidth=columns>2?totalWidth*.4:totalWidth-stepWidth;
   const widths=rows[0].map((_,i)=>i===0?stepWidth:i===columns-1?contentWidth:(totalWidth-stepWidth-contentWidth)/(columns-2));
   page.ctx.font='18px system-ui, sans-serif';
   function row(cells,header=false){
    const wrapped=cells.map((text,i)=>wrap(text,Math.max(8,widths[i]-16))),count=Math.max(...wrapped.map(parts=>parts.length));
    for(let offset=0;offset<count;){
     if(page.y+28>height-margin){newPage();page.ctx.font='18px system-ui, sans-serif'}
     const fit=Math.min(count-offset,Math.floor((height-margin-page.y-10)/24));
     if(fit<1){newPage();page.ctx.font='18px system-ui, sans-serif';continue}
     const rowHeight=fit*24+10;let x=margin;
     cells.forEach((_,i)=>{page.ctx.fillStyle=header?'#eaf5f2':'#fff';page.ctx.fillRect(x,page.y,widths[i],rowHeight);page.ctx.strokeStyle='#bdceca';page.ctx.strokeRect(x,page.y,widths[i],rowHeight);page.ctx.fillStyle='#173544';wrapped[i].slice(offset,offset+fit).forEach((text,j)=>page.ctx.fillText(text,x+8,page.y+5+j*24));x+=widths[i]});
     page.y+=rowHeight;offset+=fit;
    }
   }
   rows.forEach((cells,i)=>row(cells,i===0));
  }
  return makePdfFromCanvases(canvases);
 }
 $('choosePdf').addEventListener('click',async()=>{
  hideSaveChoices();clearFileFeedback();syncDocumentTitle();

   const blob=await buildPdfBlob(exportRows()),name=safePdfFileName(currentFileName);

   }
   const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);fileFeedback('PDFの保存を開始しました。','success');
  }catch(err){fileFeedback('PDFを作成できませんでした: '+err.message,'error')}
 });
function syncDocumentTitle(){
 const name=String($('openedName').value||'').trim().replace(/\.(?:py|pdf)$/i,'').replace(/[\\/:*?"<>|\x00-\x1F]/g,'_').replace(/[. ]+$/g,'');

}

 hideSaveChoices();clearFileFeedback();

 const name=safePyFileName(currentFileName),content=$('source').value;
 // 「フォルダーの選択」ではなく「名前を付けて保存」を表示する。
 // 同じ id を指定すると、対応ブラウザは前回使ったフォルダを初期候補にできる。
 if(typeof window.showSaveFilePicker==='function'){
  try{
   const handle=await window.showSaveFilePicker({
    id:'innovia-python-projects',
    suggestedName:name,
    types:[{description:'Pythonプログラム (.py)',accept:{'text/x-python':['.py']}}]
   });
   const writable=await handle.createWritable();

  }
 }

 link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);

});
