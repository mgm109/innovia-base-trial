<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先生用｜INNOVIA Base</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/teacher-catalog.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="../">INNOVIA Base<span class="brand-mark">✳</span></a><button id="logout" class="ghost teacher-logout" type="button" hidden>ログアウト</button></header><div class="teacher-home"><section class="catalog-intro teacher-catalog-intro"><h1>先生用画面</h1></section><nav id="teacher-view-links" class="teacher-view-links teacher-toolbar" aria-label="先生用メニュー" hidden><a class="ghost" href="prototype/" title="プロトタイプで教材を試す・追加する" aria-current="page">先生用</a><a class="ghost" href="../" title="生徒の教材一覧を開く">生徒用</a><a class="ghost teacher-order-link" href="order/" title="教材の順番と公開設定を変更する">並び順</a><button class="ghost" id="password-panel-toggle" type="button" aria-controls="password-settings" aria-expanded="false">パスワード変更</button></nav><form class="panel" id="login"><h2>先生用ログイン</h2><p class="small-note">先生用に登録したメールアドレスと現在のINNOVIAのパスワードを入力してください。</p><label class="input-label" for="email">メールアドレス</label><input class="input" id="email" name="email" type="email" autocomplete="username" required><label class="input-label" for="password">パスワード</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required><div class="actions"><button class="button" type="submit">ログイン</button></div></form><p id="message" class="inline-message" role="status"></p><div id="teacher-content" hidden><section class="panel" id="password-settings" hidden>
  <h2>パスワード変更</h2>
  <p class="small-note" id="password-help">この先生用アカウントのパスワードを変更します。新しいパスワードは8文字以上で、ほかのサービスで使っていないものを入力してください。</p>
  <form id="password-change" method="post" aria-describedby="password-help">
    <label class="input-label" for="current-password">現在のパスワード</label>
    <input class="input" id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
    <label class="input-label" for="new-password">新しいパスワード</label>
    <input class="input" id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
    <label class="input-label" for="confirm-password">新しいパスワード（確認）</label>
    <input class="input" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
    <div class="actions"><button class="button" id="change-password-button" type="submit" disabled>パスワードを変更する</button></div>
    <p id="password-message" role="status" aria-live="polite" aria-atomic="true"></p>
  </form>
</section>
<section class="catalog teacher-catalog" aria-label="先生の教材一覧"><div class="section-head"><h2>情報Ⅰの教材</h2><span id="teacher-material-count"></span></div><div id="teacher-materials" class="teacher-materials learning-grid"><p class="small-note">教材を読み込んでいます…</p></div></section>
<section class="panel"><h2>INNOVIA Base の名前の由来</h2><p class="small-note">Innovation（革新）＋Via（道）から作った名前です。新しい学びへの道という意味を込めています。</p></section></div><footer>INNOVIA Base <span>授業を、自分らしく準備しよう。</span></footer></div></main><script src="../config.js"></script><script src="../assets/client.js"></script><script src="../assets/catalog-shared.js"></script><script src="../assets/catalog-display.js"></script><script src="../assets/teacher.js"></script></body></html>
